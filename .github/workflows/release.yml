name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: scripts/build_app.sh "${GITHUB_REF_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoldToTalk
          path: build/HoldToTalk.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/HoldToTalk.zip \
            --title "HoldToTalk $GITHUB_REF_NAME" \
            --notes "Скачайте **HoldToTalk.zip**, распакуйте и перетащите HoldToTalk.app в «Программы». Инструкция по первому запуску — в README." \
            || gh release upload "$GITHUB_REF_NAME" build/HoldToTalk.zip --clobber
